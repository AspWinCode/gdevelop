# Configuration for GDevelop on subdirectory /gdevelop
# This file should be placed in your main Nginx configuration
# Location: /etc/nginx/sites-available/tirskix-academy.com

# Add this location block to your existing server configuration for tirskix-academy.com

location /gdevelop {
    alias /usr/share/nginx/html;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Cache static assets
    location ~ ^/gdevelop/.*\.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        alias /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Handle React Router - all requests go to index.html
    try_files $uri $uri/ /gdevelop/index.html;
}

