# Полная конфигурация Nginx для tirskix-academy.com с GDevelop на /gdevelop
# Файл назначения: /etc/nginx/sites-available/tirskix-academy.com

# HTTP - redirect to HTTPS
server {
    listen 80;
    server_name tirskix-academy.com www.tirskix-academy.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS
server {
    listen 443 ssl http2;
    server_name tirskix-academy.com www.tirskix-academy.com;

    # SSL certificates (Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/tirskix-academy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tirskix-academy.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    client_max_body_size 100m;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Основной сайт academy (корень домена).
    # Если у вас reverse-proxy приложение вместо статических файлов,
    # замените этот блок location / на proxy_pass к вашему upstream.
    root /var/www/tirskix-academy.com/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # GDevelop на /gdevelop (контейнер должен слушать 127.0.0.1:8080)
    location /gdevelop/ {
        proxy_pass http://localhost:8080/;
        
        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        
        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # Cache bypass
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings
        proxy_buffering off;
        proxy_request_buffering off;
    }
    
    # Redirect /gdevelop to /gdevelop/ for consistent relative paths
    location = /gdevelop {
        return 301 /gdevelop/;
    }

    # Security - deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
