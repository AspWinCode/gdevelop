# Nginx configuration for GDevelop on tirskix-academy.com/gdevelop
# This is a proxy configuration that forwards requests to the Docker container

location /gdevelop/ {
    # Proxy to Docker container running on port 8080
    proxy_pass http://localhost:8080/;
    
    # WebSocket support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    
    # Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Cache bypass
    proxy_cache_bypass $http_upgrade;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
    
    # Buffer settings
    proxy_buffering off;
    proxy_request_buffering off;
}

# Optional: redirect /gdevelop to /gdevelop/
location = /gdevelop {
    return 301 /gdevelop/;
}
