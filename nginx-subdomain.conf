# Nginx configuration for GDevelop on subdomain
# gdevelop.tirskix-academy.com

server {
    listen 80;
    server_name gdevelop.tirskix-academy.com;
    
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name gdevelop.tirskix-academy.com;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/gdevelop.tirskix-academy.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gdevelop.tirskix-academy.com/privkey.pem;
    
    # SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Proxy to Docker container
    location / {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
